[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"
 
[project]
name = "si-converter"
version = "1.0.0"
description = "Chuyển đổi đơn vị sang hệ SI — Khoa học, Kỹ thuật & Bán dẫn"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["unit", "conversion", "SI", "physics", "semiconductor", "pint"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "pint>=0.22",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
]
 
[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
app = ["streamlit>=1.32", "plotly>=5.18", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]
 
[tool.setuptools.packages.find]
where = ["."]
include = ["si_converter*"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
 
[tool.coverage.run]
source = ["si_converter"]
omit = ["tests/*", "si_converter/_cli.py"]
 